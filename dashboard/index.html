<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LassiNet — real-time network visibility, ML-based intrusion detection and firewall control in one lightweight Python app.">
<meta property="og:title" content="LassiNet — network security dashboard">
<meta property="og:description" content="Real-time network map, ML intrusion detection and one-click firewall blocking. Single Python app, no Docker, no build step.">
<meta property="og:type" content="website">
<title>LassiNet — Network Security Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🛡️</text></svg>">
<link rel="stylesheet" href="style.css?v=3.7">
<script src="vendor/vis-network.min.js"></script>
<script>
  /* bundled copy first (works offline); CDN fallback keeps partial downloads alive */
  if (typeof vis === "undefined")
    document.write('<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"><\/script>');
</script>
</head>
<body>
<header>
  <div class="brand"><span class="shield">&#128737;&#65039;</span> LassiNet</div>
  <div class="badges">
    <span id="mode-badge" class="badge">…</span>
    <span id="model-badge" class="badge secondary"></span>
  </div>
</header>

<div id="legend">
  <span class="li"><i style="background:#a371f7"></i>Router</span>
  <span class="li"><i style="background:none;font-size:11px;line-height:1">☁️</i>Internet</span>
  <span class="li"><i style="background:none;font-size:11px;line-height:1">🖥️</i>Server</span>
  <span class="li"><i style="background:none;font-size:11px;line-height:1">💻</i>Workstation</span>
  <span class="li"><i style="background:none;font-size:11px;line-height:1">📡</i>IoT</span>
  <span class="li"><i style="background:none;font-size:11px;line-height:1">🖨️</i>Printer</span>
  <span class="li"><i style="background:none;font-size:11px;line-height:1;color:#f85149">★</i>Attacker</span>
  <span class="li"><i style="border:2px solid #f85149;background:transparent;"></i>Blocked</span>
</div>

<section class="stats">
  <div class="stat"><div class="value" id="s-devices">0</div><div class="label">🖥️ devices</div></div>
  <div class="stat"><div class="value" id="s-flows">0</div><div class="label">⚡ flows/s</div></div>
  <div class="stat danger"><div class="value" id="s-alerts">0</div><div class="label">🚨 attacks</div></div>
  <div class="stat warn"><div class="value" id="s-blocked">0</div><div class="label">⛔ blocked IPs</div></div>
</section>

<main>
  <div id="map"></div>

  <aside>
    <h2>&#128679; Threat feed</h2>
    <div id="alerts" class="feed"></div>
    <h2>&#128274; Firewall rules</h2>
    <div id="rules" class="feed"></div>
    <h2>&#128225; System log</h2>
    <div id="log" class="feed log"></div>
  </aside>
</main>

<script src="app.js?v=3.7"></script>
</body>
</html>
