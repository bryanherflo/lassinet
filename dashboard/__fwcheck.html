<!DOCTYPE html>
<meta charset="utf-8">
<iframe id="f" src="/"></iframe>
<pre id="r">…</pre>
<script>
const f = document.getElementById("f"), r = document.getElementById("r");
f.addEventListener("load", async () => {
  const w = f.contentWindow, d = w.document;
  w.addEventListener("error", e => { r.textContent += "\nERROR " + e.message; });
  await new Promise(res => setTimeout(res, 5000));
  const out = [];
  const badge = d.getElementById("fw-badge");
  out.push("fw badge=" + JSON.stringify(badge.textContent) + " class=" + badge.className
           + " title=" + JSON.stringify(badge.title));
  out.push("rules note=" + JSON.stringify(d.getElementById("rules-note").textContent));
  out.push("note class=" + d.getElementById("rules-note").className);

  const host = w.nodes.get().find(n => n.kind === "camera");
  if (host) {
    w.selectedNodeIp = host.id;
    w.updateSelectionBar();
    await new Promise(res => setTimeout(res, 200));
    out.push("block title=" + JSON.stringify(d.getElementById("sel-block").title));
  }

  await w.post("/api/firewall/block", { ip: "203.0.113.99", reason: "ui check" });
  await new Promise(res => setTimeout(res, 400));
  out.push("block toast=" + JSON.stringify(d.getElementById("toast-container").textContent));
  await w.post("/api/firewall/unblock", { ip: "203.0.113.99" });
  await new Promise(res => setTimeout(res, 400));
  out.push("unblock toast=" + JSON.stringify(d.getElementById("toast-container").textContent));
  r.textContent = out.join("\n");
});
</script>
