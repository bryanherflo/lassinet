name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Train model (smoke)
        run: python ml-training/train_model.py
      - name: Run tests with coverage
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short \
            --cov=app --cov=lassi \
            --cov-report=term --cov-report=xml:coverage.xml 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Tests failed; tail follows"
            tail -n 30 pytest.out | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/''}
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # The Windows runner is administrator, so the `windows` firewall provider is
  # exercised against the real Windows Firewall instead of a mock.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Train model (smoke)
        run: python ml-training/train_model.py
      - name: Run tests (real Windows Firewall)
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Tests failed; tail follows"
            tail -n 30 pytest.out | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/''}
              echo "::error::$line"
            done
          fi
          exit "$status"

  # Advisory only: findings are visible in the log/annotations but never block
  # a release. Flip the steps to continue-on-error: false once clean.
  quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-quality.txt
      - name: Ruff (advisory)
        continue-on-error: true
        run: python -m ruff check app.py lassi tests scripts
      - name: Mypy (advisory)
        continue-on-error: true
        run: python -m mypy app.py lassi
