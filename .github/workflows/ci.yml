name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Train model (smoke)
        run: python ml-training/train_model.py
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Tests failed; tail follows"
            tail -n 30 pytest.out | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/''}
              echo "::error::$line"
            done
          fi
          exit "$status"

  # The Windows runner is administrator, so the `windows` firewall provider is
  # exercised against the real Windows Firewall instead of a mock.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Train model (smoke)
        run: python ml-training/train_model.py
      - name: Run tests (real Windows Firewall)
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Tests failed; tail follows"
            tail -n 30 pytest.out | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/''}
              echo "::error::$line"
            done
          fi
          exit "$status"
